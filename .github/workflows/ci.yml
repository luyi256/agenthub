name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s agent_hub/tests -p "test_*.py"

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_hub_vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent_hub_vscode/package-lock.json
      - run: npm ci
      - run: npm test
